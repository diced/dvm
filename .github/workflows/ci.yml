name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check

      - name: Cargo build (debug)
        run: cargo build

      - name: Package debug artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/debug/dvm dist/dvm
          tar -C dist -czf dvm-debug-linux-x86_64.tar.gz dvm

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvm-debug-linux-x86_64
          path: dvm-debug-linux-x86_64.tar.gz

