name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cargo check
        run: cargo check

      - name: Cargo build (debug)
        run: cargo build --target ${{ matrix.target }}

      - name: Prepare debug artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/debug/dvm" "dist/dvm-${{ matrix.arch }}"
          chmod +x "dist/dvm-${{ matrix.arch }}"

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvm-debug-linux-${{ matrix.arch }}
          path: dist/dvm-${{ matrix.arch }}

