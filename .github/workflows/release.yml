name: Release

on:
  push:
    branches:
      - trunk

permissions:
  contents: write

jobs:
  # --- Stage 1: Determine if we need to release ---
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.ver.outputs.should_release }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          TAG="v${VERSION}"
          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "${TAG}" == "${LATEST_TAG}" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Stage 2: Build and Upload per Architecture ---
  build-release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="dvm"
          DIST_NAME="dvm-${{ needs.check.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
          
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/$BIN_NAME"
          tar -C dist -czf "$DIST_NAME" "$BIN_NAME"
          
          echo "ASSET_PATH=$DIST_NAME" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        shell: bash
        run: |
          gh release create "${{ needs.check.outputs.tag }}" \
            --title "dvm ${{ needs.check.outputs.version }}" \
            --notes "Automated release for version ${{ needs.check.outputs.version }}." \
            --repo ${{ github.repository }} || true
          
          gh release upload "${{ needs.check.outputs.tag }}" "${{ env.ASSET_PATH }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
